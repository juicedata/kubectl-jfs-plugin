apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: jfs
spec:
  homepage: https://juicefs.com
  shortDescription: Debug JuiceFS issues in Kubernetes
  version: {{ .TagName }}
  description: |
    JuiceFS is an open-source, high-performance distributed file system designed for the cloud.
    This plugin helps debugging issues with the JuiceFS CSI driver.
    It shows Pods/PVCs/PVs which is using JuiceFS and details for debugging.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      {{addURIAndSha "https://github.com/juicedata/kubectl-jfs-plugin/releases/download/{{ .TagName }}/kubectl-jfs-plugin_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
      bin: "./kubectl-jfs"
      files:
        - from: kubectl-jfs-plugin
          to: kubectl-jfs
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      {{addURIAndSha "https://github.com/juicedata/kubectl-jfs-plugin/releases/download/{{ .TagName }}/kubectl-jfs-plugin_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
      bin: "./kubectl-jfs"
      files:
        - from: kubectl-jfs-plugin
          to: kubectl-jfs
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      {{addURIAndSha "https://github.com/juicedata/kubectl-jfs-plugin/releases/download/{{ .TagName }}/kubectl-jfs-plugin_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
      bin: "./kubectl-jfs"
      files:
        - from: kubectl-jfs-plugin
          to: kubectl-jfs
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      {{addURIAndSha "https://github.com/juicedata/kubectl-jfs-plugin/releases/download/{{ .TagName }}/kubectl-jfs-plugin_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
      bin: "./kubectl-jfs"
      files:
        - from: kubectl-jfs-plugin
          to: kubectl-jfs
        - from: LICENSE
          to: .